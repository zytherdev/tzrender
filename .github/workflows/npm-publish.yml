name: Publish to npm

on:
  push:
    branches: [ "main" ]
    paths:
      - 'package.json' # pub só se package.json mudar
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build || echo "No build needed"
    
    - name: Test
      run: npm test || echo "No tests yet"
    
    - name: Check version
      id: check
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
        # Verifica se a versão já existe no npm
        if npm view @zyther/tzrender@$VERSION version &> /dev/null; then
          echo "Version $VERSION already exists, skipping publish"
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Publish to npm
      if: steps.check.outputs.skip == 'false'
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    
